# Benchmark 配置主文件

# 全局默认配置
defaults:
  orchestrator_url: "http://localhost:8000"
  simulator_priority: "llm-first"
  judge_priority: "llm-first"
  clarification_style: "short"
  debug: false
  max_clarification_rounds: 5
  history_size: 6
  success_threshold: 0.5
  scoring_mode: "full"

# LLM 配置
llm_config:
  openai:
    api_key: "${OPENAI_API_KEY}"
    model: "gpt-4"
    temperature: 0.7
    max_tokens: 1000
  anthropic:
    api_key: "${ANTHROPIC_API_KEY}"
    model: "claude-3-sonnet"
    max_tokens: 1000

# 领域特定配置
domains:
  travel:
    name: "Travel domain"
    orchestrator_type: "travel_orchestrator"
    evaluator_type: "travel_evaluator"
    reporter_type: "html_reporter"
    user_profiles_path: "config/user_profiles_travel.yaml"
    llm_provider: "openai"
    plugin_modules:
      - plugins.travel_plugin
    features:
      - date_parsing
      - destination_extraction
      - budget_analysis
    

# 报告配置
reporting:
  default_output_dir: "output"
  formats:
    - html
    - json
    - markdown
  retention_days: 30
  archive_enabled: true