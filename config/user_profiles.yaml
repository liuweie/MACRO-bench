user_profiles:
  profile_001:
    name:
      en: Business Traveler
    characteristics:
    - care efficiency
    - middle budget
    - prefer convenient transportation
    - need business facilities
    response_patterns:
      budget:
        en: About 5000 CNY budget
      dates:
        en: Next Wed to Fri
      preferences:
        en: Prefer hotels near the conference center
  profile_002:
    name:
      en: Family Traveler
    characteristics:
    - values family-friendly facilities
    - limited budget
    - enjoys sightseeing attractions
    - needs family rooms
    response_patterns:
      budget:
        en: Family budget within 8000 CNY
      dates:
        en: During summer break, Jul 10 to Jul 15
      preferences:
        en: Needs child-friendly facilities and attractions suitable for kids
  profile_003:
    name:
      en: Backpacker
    characteristics:
    - tight budget
    - prefers independent travel
    - experience-focused
    - does not require luxury accommodation
    response_patterns:
      budget:
        en: Keep costs low, total under 3000 CNY
      dates:
        en: Flexible timing, around 5 days
      preferences:
        en: Interested in local culture, prefer budget stays
  profile_004:
    name:
      en: Luxury Traveler
    characteristics:
    - seeks premium experiences
    - ample budget
    - prefers five-star or above hotels
    - values privacy and customized service
    response_patterns:
      budget:
        en: Flexible budget, choose by experience
      dates:
        en: Flexible timing, prefer peak periods
      preferences:
        en: Arrange fine dining and private guides
  profile_005:
    name:
      en: Solo Traveler
    characteristics:
    - likes solo exploration
    - prefers flexible itineraries
    - values safety and social opportunities
    - accepts mid- to high-range accommodation
    response_patterns:
      budget:
        en: Prefer economical yet comfortable, budget depends on activities
      dates:
        en: Short trips, 3-7 days
      preferences:
        en: Prefer social activities or small group experiences
  profile_006:
    name:
      en: Senior Traveler
    characteristics:
    - prefers comfort and safety
    - needs accessible / low-intensity itineraries
    - cares about medical and insurance information
    - likes in-depth cultural travel
    response_patterns:
      budget:
        en: Moderate budget, prefer comfort
      dates:
        en: Avoid peak seasons, prefer weekdays
      preferences:
        en: Need more rest time and medical/insurance info
  profile_007:
    name:
      en: Digital Nomad
    characteristics:
    - remote worker, long-term stays
    - cares about internet and work environment
    - prefers long-stay accommodation discounts
    - likes localized lifestyle experiences
    response_patterns:
      budget:
        en: Prefer long-term cost-effective stays
      dates:
        en: Flexible long-term stays, usually monthly
      preferences:
        en: Need stable internet and workspace
